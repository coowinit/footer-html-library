<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EVODEK浅色中文社群导航型Footer方案">
  <title>EVODEK Footer 07</title>
  <script>document.documentElement.classList.replace("no-js", "has-js");</script>
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>
  <main class="demo-space" aria-hidden="true">
    <span>页面内容区域</span>
  </main>

  <footer class="site-footer">
    <div class="footer-main">
      <div class="footer-inner">
        <section class="footer-brand" aria-label="EVODEK品牌信息">
          <a class="footer-logo" href="/" aria-label="返回网站首页">
            <img src="images/foot-logo.svg" width="120" height="60" alt="DEV SNIPPETS">
          </a>

          <p class="footer-tagline">专注高品质木塑复合材料与户外空间解决方案</p>

          <nav class="footer-channels" aria-label="内容频道">
            <a href="#" aria-label="品牌社群" title="品牌社群">
              <img src="images/icon-community.svg" width="20" height="20" alt="">
            </a>
            <a href="#" aria-label="视频频道" title="视频频道">
              <img src="images/icon-video.svg" width="20" height="20" alt="">
            </a>
            <a href="#" aria-label="资料中心" title="资料中心">
              <img src="images/icon-document.svg" width="20" height="20" alt="">
            </a>
            <a href="#" aria-label="品牌动态" title="品牌动态">
              <img src="images/icon-broadcast.svg" width="20" height="20" alt="">
            </a>
          </nav>

          <div class="footer-qr">
            <div class="footer-qr-image">
              <img src="images/qr-placeholder.svg" width="68" height="68" alt="二维码占位图，正式上线前请替换">
            </div>
            <div class="footer-qr-copy">
              <p>扫码了解更多</p>
              <span>获取产品资料、安装指南与项目资讯</span>
            </div>
          </div>
        </section>

        <nav class="footer-navigation" aria-label="网站底部导航">
          <section class="footer-nav-group">
            <h2>
              <button class="footer-nav-toggle" type="button" aria-expanded="true" aria-controls="footer-products" tabindex="-1">
                <span>产品相关</span>
                <span class="toggle-icon" aria-hidden="true"></span>
              </button>
            </h2>
            <div class="footer-nav-panel" id="footer-products">
              <div class="footer-nav-panel-inner">
                <ul>
                  <li><a href="/decking/">木塑地板</a></li>
                  <li><a href="/cladding/">墙板系统</a></li>
                  <li><a href="/fencing/">围栏系统</a></li>
                  <li><a href="/colors/">产品颜色</a></li>
                  <li><a href="/accessories/">配件系统</a></li>
                </ul>
              </div>
            </div>
          </section>

          <section class="footer-nav-group">
            <h2>
              <button class="footer-nav-toggle" type="button" aria-expanded="true" aria-controls="footer-support" tabindex="-1">
                <span>服务支持</span>
                <span class="toggle-icon" aria-hidden="true"></span>
              </button>
            </h2>
            <div class="footer-nav-panel" id="footer-support">
              <div class="footer-nav-panel-inner">
                <ul>
                  <li><a href="/downloads/">下载中心</a></li>
                  <li><a href="/installation/">安装指南</a></li>
                  <li><a href="/faq/">常见问题</a></li>
                  <li><a href="/warranty/">质保服务</a></li>
                  <li><a href="/quote/">获取报价</a></li>
                </ul>
              </div>
            </div>
          </section>

          <section class="footer-nav-group">
            <h2>
              <button class="footer-nav-toggle" type="button" aria-expanded="true" aria-controls="footer-company" tabindex="-1">
                <span>关于我们</span>
                <span class="toggle-icon" aria-hidden="true"></span>
              </button>
            </h2>
            <div class="footer-nav-panel" id="footer-company">
              <div class="footer-nav-panel-inner">
                <ul>
                  <li><a href="/about/">公司介绍</a></li>
                  <li><a href="/factory/">生产实力</a></li>
                  <li><a href="/quality/">质量认证</a></li>
                  <li><a href="/projects/">项目案例</a></li>
                  <li><a href="/contact/">联系我们</a></li>
                </ul>
              </div>
            </div>
          </section>
        </nav>
      </div>
    </div>

    <div class="footer-records">
      <div class="footer-records-inner">
        <span>© 2026 EVODEK<sup>®</sup></span>
        <span>ICP备案号：请替换</span>
        <span class="public-record">
          <img src="images/beianico.png" width="20" height="20" alt="公安备案图标">
          公安备案号：请替换
        </span>
      </div>
    </div>
  </footer>

  <script src="js/footer.js" defer></script>
</body>
</html>
